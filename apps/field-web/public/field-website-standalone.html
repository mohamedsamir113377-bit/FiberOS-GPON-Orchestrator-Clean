<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FiberOS Field Tech — R14.1</title><style>
body{font-family:system-ui,Segoe UI,sans-serif;background:#071018;color:#e8f1f7;margin:0;padding:18px}.wrap{max-width:980px;margin:auto}.card{background:#0e1b25;border:1px solid #203541;border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.btn{background:#17c7d6;color:#001015;border:0;padding:11px 14px;border-radius:9px;font-weight:800;cursor:pointer}.danger{background:#e25555;color:#fff}.ghost{background:#152731;color:#dce9ef;border:1px solid #29414d}.muted{color:#90a8b6;font-size:.86rem}label{display:block;margin:9px 0 5px}.input,textarea,select{width:100%;box-sizing:border-box;background:#09141c;border:1px solid #29414d;color:#e8f1f7;padding:10px;border-radius:8px}video{width:100%;max-height:420px;background:#000;border-radius:10px}.kpi{font-size:1.8rem;font-weight:900}pre{white-space:pre-wrap;word-break:break-word}.ok{color:#63e6be}.warn{color:#ffd166}.bad{color:#ff8080}.pill{display:inline-block;border:1px solid #355361;padding:4px 8px;border-radius:999px;font-size:.75rem;margin:2px}
</style></head><body><div class="wrap"><h1>📷 FiberOS Field Tech</h1><div class="muted">تشغيل ميداني فعلي: كاميرا + OCR + GPS + Evidence + إغلاق server-authoritative. لا توجد بيانات GPS/Serial افتراضية.</div>
<div class="card"><label>JWT Bearer Token</label><input id="token" class="input" placeholder="الصق JWT من Supabase/Auth"><label>API Base</label><input id="apiBase" class="input" value=""><label>Ticket ID</label><input id="ticket" class="input" placeholder="UUID للتذكرة"><div class="row"><button class="btn" onclick="gps()">📍 التقاط GPS</button><button class="btn ghost" onclick="start()">🎥 تشغيل الكاميرا</button><button class="btn ghost" onclick="snap()">📸 التقاط + OCR</button></div><div id="gpsOut" class="muted">GPS: —</div></div>
<div class="grid"><div class="card"><h3>كاميرا / OCR</h3><video id="video" autoplay playsinline muted></video><canvas id="canvas" hidden></canvas><div id="ocrOut" class="muted">OCR: —</div><label>ONT Serial</label><input id="serial" class="input"><label>Box Code</label><input id="box" class="input"></div>
<div class="card"><h3>قراءة القدرة</h3><label>Rx dBm</label><input id="rx" class="input" type="number" step="0.1" placeholder="مثل -23.4"><label>ملحوظة</label><textarea id="note" class="input" rows="5"></textarea><div class="row"><button class="btn" onclick="submitEvidence()">حفظ Evidence</button><button class="btn danger" onclick="closeTicket()">إغلاق التذكرة</button></div><pre id="out">—</pre></div></div>
<div class="card"><h3>حالة التشغيل</h3><div><span class="pill">server-authoritative close</span><span class="pill">photo freshness server-side</span><span class="pill">geofence server-side</span><span class="pill">no simulated close</span></div><div id="status" class="muted">جاهز.</div></div>
</div><script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js" integrity="sha512-mpQLT7yiRJ06RkhNTYhVnvvr3c71il3h+wEI16ICc+fnFHxrBRoJrMmDJ8iBY04+U/FgTj7xah5Vbltq5pg+aQ==" crossorigin="anonymous"></script><script>
let stream=null,lat=null,lng=null,lastPhotoHash=null,lastCapturedAt=null;
const $=id=>document.getElementById(id);
function apiBase(){return $('apiBase').value.replace(/\/$/,'')||location.origin}
async function api(path,opts={}){const h=opts.headers||{};h['Content-Type']='application/json';const t=$('token').value.trim();if(t)h.Authorization='Bearer '+t;const r=await fetch(apiBase()+path,{...opts,headers:h});let b={};try{b=await r.json()}catch(e){b={error:'INVALID_JSON_RESPONSE'}}if(!r.ok)throw new Error(b.error||('HTTP_'+r.status));return b}
async function gps(){if(!navigator.geolocation)throw new Error('GEOLOCATION_UNAVAILABLE');const p=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:0}));lat=p.coords.latitude;lng=p.coords.longitude;$('gpsOut').textContent=`GPS: ${lat.toFixed(6)}, ${lng.toFixed(6)} (accuracy ${Math.round(p.coords.accuracy||0)}m)`;return {lat,lng}}
async function start(){if(!navigator.mediaDevices?.getUserMedia)throw new Error('CAMERA_UNAVAILABLE');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});$('video').srcObject=stream}
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function snap(){if(!stream)await start();const v=$('video'),c=$('canvas');c.width=v.videoWidth||1280;c.height=v.videoHeight||720;c.getContext('2d').drawImage(v,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));const dataUrl=await new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(blob)});lastCapturedAt=new Date().toISOString();lastPhotoHash=await sha256(dataUrl);$('ocrOut').textContent='OCR: يعمل...';try{const out=await Tesseract.recognize(dataUrl,'eng',{logger:m=>{if(m.status==='recognizing text')$('ocrOut').textContent='OCR: '+Math.round((m.progress||0)*100)+'%'}});const text=(out.data.text||'').trim();$('ocrOut').textContent=text?'OCR: '+text.slice(0,500):'OCR: لم يتم العثور على نص';const serial=(text.match(/(?:SN|S\/N|SERIAL)\s*[:#-]?\s*([A-Z0-9._-]{5,})/i)||[])[1];if(serial&&!$('serial').value)$('serial').value=serial}catch(e){$('ocrOut').textContent='OCR failed: '+e.message}}
async function submitEvidence(){await ensureGps();const ticketId=$('ticket').value.trim();if(!ticketId)throw new Error('TICKET_ID_REQUIRED');const payload={ontSerial:$('serial').value.trim()||null,boxCode:$('box').value.trim()||null,rxDbm:$('rx').value===''?null:Number($('rx').value),note:$('note').value,gps:{lat,lng},capturedAt:lastCapturedAt||new Date().toISOString()};const b=await api('/v1/evidence/submit',{method:'POST',body:JSON.stringify({ticketId,kind:'ocr',source:'field',payload,contentHash:lastPhotoHash})});$('out').textContent=JSON.stringify(b,null,2);$('status').textContent=b.persisted?'Evidence محفوظ في DB.':'تم قبول الطلب دون persistence؛ يلزم DB.'}
async function closeTicket(){await ensureGps();const ticketId=$('ticket').value.trim();if(!ticketId)throw new Error('TICKET_ID_REQUIRED');if(!lastCapturedAt||!lastPhotoHash)throw new Error('PHOTO_CAPTURE_REQUIRED');const b=await api('/v1/tickets/close-field',{method:'POST',body:JSON.stringify({ticketId,toStatus:'completed',jobGps:{lat,lng},deviceGps:{lat,lng},photo:{capturedAt:lastCapturedAt,contentHash:lastPhotoHash},rxDbm:$('rx').value===''?undefined:Number($('rx').value),opticalSources:[$('rx').value===''?'field_reading':'field_reading'],ontSerial:$('serial').value.trim()||null,boxCode:$('box').value.trim()||null,idempotencyKey:'field-'+ticketId+'-'+lastPhotoHash.slice(0,16)})});$('out').textContent=JSON.stringify(b,null,2);$('status').textContent=b.ok?'تمت معالجة الإغلاق حسب بوابة الخادم.':'الإغلاق مرفوض/معلّق؛ راجع الأسباب.'}
async function ensureGps(){if(lat==null||lng==null)await gps()}
window.addEventListener('beforeunload',()=>stream?.getTracks().forEach(t=>t.stop()));
window.addEventListener('error',e=>{$('status').textContent='Error: '+e.message;$('status').className='bad'});window.addEventListener('unhandledrejection',e=>{$('status').textContent='Error: '+(e.reason?.message||e.reason);$('status').className='bad'});
</script><script src="i18n-selector.js" defer></script><script src="i18n-runtime.js" defer></script></body></html>
