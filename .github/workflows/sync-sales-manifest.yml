name: sync-sales-manifest

# The sales manifest is part of the reviewed release boundary.
# CI validates the committed ledger/manifest against the exact checked-out tree.
# It must never rewrite generated artifacts, create commits, or push from CI.

on:
  push:
    branches:
      - handoff/final-commercial-candidate-2026-10-07
      - feature/deep-gis-faults-2026-10-07
      - feat/deep-reality-kernel-gaps
      - feat/website-ftth-asset-hierarchy-2026-10-09
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sales-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source tree without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify migration extension SHA-256 ledger without rewriting it
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const dir = 'sql/migrations';
          const ledger = dir + '/PRODUCTION_MIGRATIONS.extra.sha256';
          const files = fs.readdirSync(dir)
            .filter((name) => /^\d{3}_.+\.sql$/.test(name) && Number(name.slice(0, 3)) >= 117)
            .sort();
          const expected = files.map((name) =>
            crypto.createHash('sha256').update(fs.readFileSync(dir + '/' + name)).digest('hex') + '  ' + name
          ).join('\n') + '\n';
          const actual = fs.readFileSync(ledger, 'utf8');
          if (actual !== expected) {
            console.error('Migration checksum ledger drift detected; regenerate with the canonical release tool, review the diff, and commit it.');
            process.exit(1);
          }
          console.log('Migration extension checksum ledger matches the checked-out migration files.');
          NODE

      - name: Verify canonical sales manifest and all generated provenance
        run: npm run verify:manifest
