name: database-migrations

# Runs the repository's pinned PostgreSQL/PostGIS migration and RLS gate in an
# ephemeral CI database. It never connects to Supabase or any external database.
on:
  push:
    branches:
      - main
      - 'audit/**'
    paths:
      - 'sql/**'
      - 'packages/db/**'
      - 'scripts/migrate.js'
      - 'scripts/buyer-acceptance/**'
      - '.github/workflows/runtime-postgres-rls.yml'
      - '.github/workflows/database-migrations.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
  pull_request:
    paths:
      - 'sql/**'
      - 'packages/db/**'
      - 'scripts/migrate.js'
      - 'scripts/buyer-acceptance/**'
      - '.github/workflows/runtime-postgres-rls.yml'
      - '.github/workflows/database-migrations.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-migrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-postgis-rls:
    name: PostgreSQL 18.6 / PostGIS 3.6 migration and RLS gate
    uses: ./.github/workflows/runtime-postgres-rls.yml
    permissions:
      contents: read
