name: release-admission

on:
  push:
    branches:
      - main
      - feature/installation-command-workflows-2026-10-07
      - handoff/final-commercial-candidate-2026-10-07
      - feat/deep-reality-kernel-gaps
      - feat/website-ftth-asset-hierarchy-2026-10-09
      - feature/deep-gis-faults-2026-10-07
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source verification
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
  postgres-rls:
    name: PostgreSQL/PostGIS RLS runtime gate
    uses: ./.github/workflows/runtime-postgres-rls.yml
    permissions:
      contents: read
  container-security:
    name: Runtime container security gate
    uses: ./.github/workflows/runtime-container-security.yml
    permissions:
      contents: read
  security:
    name: Release source security gate
    uses: ./.github/workflows/release-security-gate.yml
    permissions:
      contents: read
  final-admission:
    name: Final release admission
    needs: [verify, postgres-rls, container-security, security]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fail closed unless every required gate succeeded
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          POSTGRES_RLS_RESULT: ${{ needs.postgres-rls.result }}
          CONTAINER_SECURITY_RESULT: ${{ needs.container-security.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          for result in "$VERIFY_RESULT" "$POSTGRES_RLS_RESULT" "$CONTAINER_SECURITY_RESULT" "$SECURITY_RESULT"; do
            test "$result" = "success"
          done
      - name: Checkout admitted source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          # Union closure requires the complete object graph.
          fetch-depth: 0
      - name: Verify final source truth boundary
        run: |
          set -euo pipefail
          if git ls-files -z '*.zip' '*.tar' '*.tar.gz' | grep -q .; then exit 1; fi
          if git ls-files -z | grep -Ez '(^|/)(.env|.env.[^e][^x][^a][^m][^p][^l][^e].*|[^/]+\.(pem|key|p12|pfx))$' | grep -q .; then exit 1; fi
          node scripts/verify-pre-db-final.js
          node scripts/verify-release-integrity.js
          node scripts/verify-root-cause-gates.js
          node scripts/verify-union-closure.js
      - name: Record final admission boundary
        run: |
          cat > release-admission.txt <<'EOF'
          FiberOS release admission boundary
          This admission is produced by one orchestrated workflow run.
          It does not certify external customer infrastructure.
          EOF
      - name: Upload final admission evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: FiberOS-release-admission-${{ github.sha }}
          path: release-admission.txt
          if-no-files-found: error
          retention-days: 30
