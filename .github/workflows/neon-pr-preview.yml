name: Neon PR Preview Branch

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: neon-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  create_neon_branch:
    name: Bootstrap, migrate, and verify isolated Neon preview
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate required Neon configuration exists
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEON_PROJECT_ID" || { echo "::error::Repository variable NEON_PROJECT_ID is missing"; exit 1; }
          test -n "$NEON_API_KEY" || { echo "::error::Repository secret NEON_API_KEY is missing"; exit 1; }

      - name: Checkout exact pull-request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up pinned Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Refresh canonical provenance and verify buyer-package inventory
        run: |
          set -euo pipefail
          node scripts/release-provenance.js
          node scripts/verify-manifest-parity.js
          node scripts/release-provenance.js --check

      - name: Upload canonical provenance refresh for reviewed commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sales-provenance-refresh-${{ github.event.pull_request.head.sha }}
          path: |
            SALES_PACKAGE_MANIFEST.json
            apps/ops-web/public/buyer-data.json
            docs/commercial/COMMERCIAL_RELEASE_STATUS.md
            docs/commercial/COMMERCIAL_RELEASE_RECEIPT.md
            FINAL_VERIFICATION_STATUS.md
            docs/PACKAGE_CONTENTS_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Set preview branch expiration (14 days)
        id: expiry
        run: echo "expires_at=$(date -u --date='+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create or reuse the isolated Neon preview branch for this PR
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          parent_branch: main
          database: neondb
          role: neondb_owner
          ssl: verify-full
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ steps.expiry.outputs.expires_at }}

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Install exact lockfile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify inherited Neon schema and checksum-verified migrations
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          PG_SSL: "true"
          PG_SSL_REJECT_UNAUTHORIZED: "true"
          PGSSLROOTCERT: system
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "::error::Neon did not return the pooled database URL"; exit 1; }

          role_profile="$(psql "$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT current_user || '|super=' || rolsuper::text || '|create-role=' || rolcreaterole::text FROM pg_roles WHERE rolname=current_user")"
          echo "Neon preview role profile: $role_profile"

          # The preview is cloned from Neon main: verify the inherited least-privilege
          # roles and applied migration ledger without mutating managed database roles.
          role_mismatches="$(psql "$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="
            WITH expected(rolname, can_login, is_super, can_create_db, can_create_role, bypass_rls, can_inherit) AS (
              VALUES
                ('fiberos_owner', false, false, false, false, false, false),
                ('fiberos_app', false, false, false, false, false, true),
                ('fiberos_migrator', true, false, false, false, false, false),
                ('fiberos_runtime', true, false, false, false, false, false),
                ('fiberos_worker', true, false, false, false, false, false),
                ('fiberos_policy_reader', false, false, false, false, true, false),
                ('authenticated', false, false, false, false, false, false),
                ('anon', false, false, false, false, false, false)
            )
            SELECT count(*)
            FROM expected e
            LEFT JOIN pg_roles r USING (rolname)
            WHERE r.oid IS NULL
               OR r.rolcanlogin <> e.can_login
               OR r.rolsuper <> e.is_super
               OR r.rolcreatedb <> e.can_create_db
               OR r.rolcreaterole <> e.can_create_role
               OR r.rolbypassrls <> e.bypass_rls
               OR r.rolinherit <> e.can_inherit
          ")"
          test "$role_mismatches" = "0" || { echo "::error::Inherited Neon role contract mismatch count=$role_mismatches"; exit 1; }

          # Compare every applied row to both canonical source SHA-256 ledgers. This
          # is read-only and avoids SET ROLE / ALTER ROLE operations that managed Neon
          # owners are intentionally not permitted to perform on inherited roles.
          actual_history_file="$(mktemp)"
          trap 'rm -f "$actual_history_file"' EXIT
          psql "$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --field-separator='|' --command="SELECT migration_name, sha256 FROM public.fiberos_migration_history ORDER BY migration_name COLLATE \"C\"" > "$actual_history_file"

          node - "$actual_history_file" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.cwd();
          const dir = path.join(root, 'sql', 'migrations');
          const manifest = fs.readFileSync(path.join(dir, 'PRODUCTION_MIGRATIONS.txt'), 'utf8')
            .split(/\r?\n/).map(s => s.trim()).filter(s => /^[0-9]{3}_.+\.sql$/.test(s));
          const parseLedger = file => {
            const map = new Map();
            for (const line of fs.readFileSync(path.join(dir, file), 'utf8').split(/\r?\n/).map(s => s.trim()).filter(Boolean)) {
              const match = /^([a-f0-9]{64})\s+(\S+)$/.exec(line);
              if (!match) throw new Error('INVALID_CHECKSUM_LEDGER_LINE:' + file);
              map.set(match[2], match[1]);
            }
            return map;
          };
          const hashes = new Map([
            ...parseLedger('PRODUCTION_MIGRATIONS.sha256'),
            ...parseLedger('PRODUCTION_MIGRATIONS.extra.sha256')
          ]);
          const actual = fs.readFileSync(process.argv[2], 'utf8').split(/\r?\n/)
            .filter(Boolean).map(line => {
              const cut = line.lastIndexOf('|');
              if (cut <= 0) throw new Error('INVALID_DATABASE_MIGRATION_HISTORY_ROW');
              return { name: line.slice(0, cut), sha256: line.slice(cut + 1) };
            });
          if (actual.length !== manifest.length) throw new Error('MIGRATION_COUNT_MISMATCH: expected=' + manifest.length + ' actual=' + actual.length);
          for (let i = 0; i < manifest.length; i++) {
            const name = manifest[i], row = actual[i];
            if (row.name !== name) throw new Error('MIGRATION_ORDER_OR_NAME_MISMATCH: expected=' + name + ' actual=' + row.name);
            if (!hashes.has(name)) throw new Error('SOURCE_CHECKSUM_MISSING:' + name);
            if (hashes.get(name) !== row.sha256) throw new Error('APPLIED_MIGRATION_CHECKSUM_MISMATCH:' + name);
          }
          console.log('Neon applied migration history matches both source ledgers: ' + actual.length + ' migrations; latest=' + actual[actual.length - 1].name);
          NODE

          expected_count="$(grep -Ec '^[0-9]{3}_.+\.sql$' sql/migrations/PRODUCTION_MIGRATIONS.txt)"
          expected_last="$(grep -E '^[0-9]{3}_.+\.sql$' sql/migrations/PRODUCTION_MIGRATIONS.txt | tail -n 1)"
          actual_history="$(psql "$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT count(*)::text || '|' || COALESCE(max(migration_name COLLATE \"C\"), '') FROM public.fiberos_migration_history")"
          IFS='|' read -r actual_count actual_last <<< "$actual_history"
          test "$actual_count" = "$expected_count" || { echo "::error::Migration count mismatch: expected $expected_count, got $actual_count"; exit 1; }
          test "$actual_last" = "$expected_last" || { echo "::error::Migration head mismatch: expected $expected_last, got $actual_last"; exit 1; }

          expected_digest="$(node -e 'const g = require("./scripts/production-readiness-gate"); console.log(g.migrationHistoryFingerprint(g.loadExpectedMigrationLedger().migrations))')"
          actual_attestation="$(psql "$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT migration_count::text || '|' || latest_migration || '|' || ledger_sha256 FROM public.fiberos_migration_history_attestation()")"
          IFS='|' read -r attested_count attested_last attested_digest <<< "$actual_attestation"
          test "$attested_count" = "$expected_count" || { echo "::error::Migration attestation count mismatch"; exit 1; }
          test "$attested_last" = "$expected_last" || { echo "::error::Migration attestation head mismatch"; exit 1; }
          test "$attested_digest" = "$expected_digest" || { echo "::error::Migration attestation checksum fingerprint mismatch"; exit 1; }

          test "$(psql "$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT has_table_privilege('fiberos_runtime','public.fiberos_migration_history','SELECT')")" = "f" || { echo "::error::Runtime identity can read the raw migration ledger"; exit 1; }
          test "$(psql "$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT has_function_privilege('fiberos_runtime','public.fiberos_migration_history_attestation()','EXECUTE')")" = "t" || { echo "::error::Runtime identity cannot execute the migration attestation"; exit 1; }

          ownership="$(psql "$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT string_agg(p.proname || '=' || pg_get_userbyid(p.proowner), ',' ORDER BY p.proname) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname IN ('fiberos_current_tenant_id','fiberos_guard_fk_tenant_match','fiberos_guard_composite_fk_tenant_match')")"
          test "$ownership" = "fiberos_current_tenant_id=fiberos_policy_reader,fiberos_guard_composite_fk_tenant_match=fiberos_policy_reader,fiberos_guard_fk_tenant_match=fiberos_policy_reader" || { echo "::error::Tenant resolver functions have unexpected owners"; exit 1; }
          test "$(psql "$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT has_schema_privilege('fiberos_policy_reader','public','CREATE')")" = "f" || { echo "::error::Policy-reader schema CREATE privilege remains enabled"; exit 1; }
          test "$(psql "$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT pg_has_role('fiberos_owner','fiberos_policy_reader','MEMBER')")" = "f" || { echo "::error::Policy-reader membership remains on owner role"; exit 1; }

          metrics="$(psql "$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT count(*) FILTER (WHERE relkind IN ('r','p'))::text || '|' || count(*) FILTER (WHERE relkind IN ('r','p') AND relrowsecurity)::text FROM pg_class WHERE relnamespace='public'::regnamespace")"
          IFS='|' read -r public_tables rls_tables <<< "$metrics"
          test "$public_tables" -gt 0 || { echo "::error::No public application tables exist"; exit 1; }
          test "$rls_tables" -gt 0 || { echo "::error::No public tables have row-level security enabled"; exit 1; }

          for extension in postgis pgcrypto btree_gist; do
            installed="$(psql "$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT EXISTS (SELECT 1 FROM pg_extension WHERE extname = '$extension')")"
            test "$installed" = "t" || { echo "::error::Required extension not installed: $extension"; exit 1; }
          done

          echo "Neon preview verification passed: migrations=$actual_count latest=$actual_last public_tables=$public_tables rls_tables=$rls_tables"
          echo "Migration attestation matches source; runtime cannot read the raw ledger."
          echo "Required PostgreSQL extensions and role/ownership/RLS boundaries verified; no credentials are printed."

  delete_neon_branch:
    name: Delete this PR commit's Neon preview when PR closes
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required Neon configuration exists
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEON_PROJECT_ID" || { echo "::error::Repository variable NEON_PROJECT_ID is missing"; exit 1; }
          test -n "$NEON_API_KEY" || { echo "::error::Repository secret NEON_API_KEY is missing"; exit 1; }

      - name: Delete this PR's Neon preview branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
