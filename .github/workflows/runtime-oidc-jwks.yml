name: runtime-oidc-jwks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oidc-jwks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify live OIDC/JWKS
        env:
          OIDC_JWKS_URL: ${{ secrets.FIBEROS_OIDC_JWKS_URL }}
          OIDC_ISSUER: ${{ secrets.FIBEROS_OIDC_ISSUER }}
          OIDC_AUDIENCE: ${{ secrets.FIBEROS_OIDC_AUDIENCE }}
          OIDC_JWKS_ALLOWED_HOSTS: ${{ secrets.FIBEROS_OIDC_JWKS_ALLOWED_HOSTS }}
          OIDC_JWKS_ALLOWED_CIDRS: ${{ secrets.FIBEROS_OIDC_JWKS_ALLOWED_CIDRS }}
          OIDC_TEST_BEARER: ${{ secrets.FIBEROS_OIDC_TEST_BEARER }}
        run: node scripts/buyer-acceptance/live-oidc-jwks.js
