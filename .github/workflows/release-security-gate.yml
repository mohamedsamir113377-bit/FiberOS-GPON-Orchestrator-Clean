name: release-security-gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Reusable workflow: concurrency is owned by the caller (see release-admission.yml).

jobs:
  source-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Reject tracked delivery archives
        run: |
          set -euo pipefail
          if git ls-files -z '*.zip' '*.tar' '*.tar.gz' | grep -q .; then
            echo 'Tracked delivery archives are forbidden in the source repository.'
            git ls-files '*.zip' '*.tar' '*.tar.gz'
            exit 1
          fi

      - name: Reject committed local environment files
        run: |
          set -euo pipefail
          bad=''
          while IFS= read -r file; do
            case "$file" in
              .env|*/.env|.env.*|*/.env.*)
                case "$file" in
                  *.example) ;;
                  *)
                    if [ -n "$bad" ]; then bad="$bad"$'\n'; fi
                    bad="${bad}${file}"
                    ;;
                esac
                ;;
              *.pem|*.key|*.p12|*.pfx)
                if [ -n "$bad" ]; then bad="$bad"$'\n'; fi
                bad="${bad}${file}"
                ;;
            esac
          done < <(git ls-files)
          if [ -n "$bad" ]; then
            echo 'Potential local secret/configuration files are tracked:'
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Reject private-key material and common credential assignments
        run: |
          set -euo pipefail
          pattern='-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github'"_pat_"'[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|napi_[A-Za-z0-9]{20,}|vcp_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|sk-[A-Za-z0-9]{20,}|sbp_[A-Za-z0-9]{20,}'
          if git grep -nHE -- "$pattern" -- . ':!apps/field-web/public/vendor/**' ':!packages/secrets-data-leakage/**' ':!scripts/verify-commercial-release.js' ':!.github/workflows/release-security-gate.yml'; then
            echo 'Credential/private-key material detected in tracked source.'
            exit 1
          fi

      - name: Verify controlled source origin
        run: |
          set -euo pipefail
          origin="$(git config --get remote.origin.url || true)"
          origin="${origin%.git}"
          expected_https="${{ github.server_url }}/${{ github.repository }}"
          expected_ssh="git@github.com:${{ github.repository }}"
          expected_ssh_url="ssh://git@github.com/${{ github.repository }}"
          case "$origin" in
            "$expected_https"|"$expected_ssh"|"$expected_ssh_url") ;;
            *)
              echo 'Unexpected repository origin; source release must run from the controlled repository context.'
              echo "Observed origin: $origin"
              echo "Expected repository: $expected_https"
              exit 1
              ;;
          esac

      - name: Run static release truth gates
        run: |
          set -euo pipefail
          node scripts/verify-release-integrity.js
          node scripts/verify-pre-db-final.js
          node scripts/verify-domain-neutrality.js
