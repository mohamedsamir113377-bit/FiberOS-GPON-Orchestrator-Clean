name: runtime-container-security

# Real Docker build/admission checks for every shipped runtime service.
# This gate never pushes images. It verifies the exact build contract and
# runtime properties that are locally testable before customer infrastructure.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Reusable workflow: concurrency is owned by the caller (see release-admission.yml).

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, ai, gis]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout final release tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify immutable Node base image pin
        run: |
          set -euo pipefail
          image='node:24.21.0-bookworm-slim@sha256:713cfbf4a0ac19f40e1bb9919893e126b74a5c8cf5d0623c9f89515c8f74c6fa'
          grep -Fqx 'FROM node:24.21.0-bookworm-slim@sha256:713cfbf4a0ac19f40e1bb9919893e126b74a5c8cf5d0623c9f89515c8f74c6fa AS build' docker/Dockerfile.runtime
          grep -Fqx 'FROM node:24.21.0-bookworm-slim@sha256:713cfbf4a0ac19f40e1bb9919893e126b74a5c8cf5d0623c9f89515c8f74c6fa AS runtime' docker/Dockerfile.runtime
          docker pull "$image"
          docker image inspect "$image" --format 'base_image={{.Id}}'

      - name: Build runtime image
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: fiberos-runtime:${{ matrix.service }}-${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --pull --file docker/Dockerfile.runtime --build-arg "SERVICE=$SERVICE" --tag "$IMAGE" .

      - name: Assert runtime image contract
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: fiberos-runtime:${{ matrix.service }}-${{ github.sha }}
        run: |
          set -euo pipefail

          user="$(docker image inspect "$IMAGE" --format '{{.Config.User}}')"
          entrypoint="$(docker image inspect "$IMAGE" --format '{{json .Config.Entrypoint}}')"
          test "$user" = "node"
          test "$entrypoint" = '["/usr/local/bin/fiberos-entrypoint"]'
          test "$(docker run --rm --read-only --entrypoint node "$IMAGE" -p 'process.getuid()')" != "0"

          case "$SERVICE" in
            api|ai|gis) expected="/workspace/services/$SERVICE/src/server.js" ;;
            worker) expected="/workspace/services/worker/src/worker.js" ;;
            *) exit 1 ;;
          esac
          docker run --rm -e "EXPECTED_ENTRY=$expected" --entrypoint node "$IMAGE" -e '
            const fs = require("node:fs");
            const expected = process.env.EXPECTED_ENTRY;
            const actual = fs.readFileSync("/usr/local/bin/fiberos-entrypoint", "utf8").trimEnd();
            const expectedLine = "exec node " + expected + " \"$@\"";
            if (actual !== "#!/bin/sh\nset -eu\n" + expectedLine) {
              console.error("RUNTIME_ENTRYPOINT_MISMATCH");
              console.error(actual);
              process.exit(1);
            }
          '

          docker run --rm --read-only --entrypoint /bin/sh "$IMAGE" -c 'if touch /workspace/.fiberos-write-test 2>/dev/null; then echo "Runtime filesystem is writable"; exit 1; fi'
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev --entrypoint /bin/sh "$IMAGE" -c 'set -eu; touch /tmp/fiberos-read-only-test; rm -f /tmp/fiberos-read-only-test'

      - name: Assert repository-only sources are absent from runtime image
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: fiberos-runtime:${{ matrix.service }}-${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint node "$IMAGE" -e '
            const fs = require("node:fs");
            const forbidden = [
              "/workspace/sql",
              "/workspace/scripts",
              "/workspace/.git"
            ];
            for (const path of forbidden) {
              if (fs.existsSync(path)) {
                console.error("FORBIDDEN_RUNTIME_PATH_PRESENT:" + path);
                process.exit(1);
              }
            }
          '

      - name: Record image admission evidence
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: fiberos-runtime:${{ matrix.service }}-${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "service=$SERVICE"
            echo "image=$IMAGE"
            echo "image_id=$(docker image inspect "$IMAGE" --format '{{.Id}}')"
            echo "user=$(docker image inspect "$IMAGE" --format '{{.Config.User}}')"
            echo "entrypoint=$(docker image inspect "$IMAGE" --format '{{json .Config.Entrypoint}}')"
            echo "cmd=$(docker image inspect "$IMAGE" --format '{{json .Config.Cmd}}')"
          } > "runtime-image-$SERVICE.txt"

      - name: Upload image admission evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FiberOS-runtime-image-security-${{ matrix.service }}-${{ github.sha }}
          path: runtime-image-${{ matrix.service }}.txt
          if-no-files-found: error
          retention-days: 14
