name: runtime-postgres-rls

# Release gate: production migration history must be complete before the live
# Adversarial DB audit rerun trigger: 2026-09-22T20:21Z
# RLS attack/concurrency harness is allowed to run.
# Credentials in this workflow are disposable CI-only credentials for the
# ephemeral PostgreSQL/PostGIS service.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Reusable workflow: concurrency is owned by the caller (see release-admission.yml).

jobs:
  postgres-rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
        env:
          POSTGRES_PASSWORD: fiberos-ci-admin
          POSTGRES_USER: postgres
          POSTGRES_DB: fiberos
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fiberos"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      EXPECTED_POSTGIS_IMAGE_DIGEST: sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
      POSTGIS_IMAGE: postgis/postgis@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
      ADMIN_URL: postgresql://postgres:fiberos-ci-admin@127.0.0.1:5432/fiberos
      MIGRATOR_URL: postgresql://fiberos_migrator:fiberos-ci-migrator@127.0.0.1:5432/fiberos
      APP_URL: postgresql://fiberos_runtime:fiberos-ci-runtime@127.0.0.1:5432/fiberos

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Syntax-check adversarial database audit scripts
        run: node --check scripts/buyer-acceptance/adversarial-db-static-audit.js && node --check scripts/buyer-acceptance/adversarial-db-runtime-audit.js && node --check scripts/buyer-acceptance/adversarial-tenant-fk-mutation-audit.js

      - name: Execute adversarial static database-boundary audit
        run: node scripts/buyer-acceptance/adversarial-db-static-audit.js

      - name: Verify PostGIS image identity before database access
        run: |
          set -euo pipefail
          echo "Inspecting $POSTGIS_IMAGE"
          repo_digests="$(docker image inspect "$POSTGIS_IMAGE" --format '{{range .RepoDigests}}{{println .}}{{end}}')"
          printf '%s\n' "$repo_digests"
          printf '%s\n' "$repo_digests" | grep -Fx "postgis/postgis@$EXPECTED_POSTGIS_IMAGE_DIGEST"
          echo "Verified pinned PostGIS image digest: $EXPECTED_POSTGIS_IMAGE_DIGEST"

      - name: Assert live PostgreSQL and PostGIS versions
        run: |
          set -euo pipefail
          server_version_num="$(psql "$ADMIN_URL" -Atqc "SELECT current_setting('server_version_num')::int")"
          test "$server_version_num" -ge 180006
          test "$server_version_num" -lt 190000
          postgis_default_version="$(psql "$ADMIN_URL" -Atqc "SELECT default_version FROM pg_available_extensions WHERE name='postgis'")"
          case "$postgis_default_version" in
            3.6.*) ;;
            *) echo "POSTGIS_3_6_REQUIRED: $postgis_default_version" >&2; exit 1 ;;
          esac
          printf 'Verified PostgreSQL server_version_num=%s and PostGIS default_version=%s\n' "$server_version_num" "$postgis_default_version"

      - name: Bootstrap production roles
        run: |
          set -euo pipefail
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -f sql/bootstrap/00_production_roles.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS auth"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY, email text, raw_app_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb, raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb, created_at timestamptz NOT NULL DEFAULT now(), updated_at timestamptz NOT NULL DEFAULT now());"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -f sql/bootstrap/01_production_auth_shim.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -f sql/bootstrap/02_extension_bootstrap.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE fiberos_migrator PASSWORD 'fiberos-ci-migrator'; ALTER ROLE fiberos_runtime PASSWORD 'fiberos-ci-runtime';"

      - name: Print CI integrity hashes for runtime harness files
        run: |
          set -euo pipefail
          sha256sum .github/workflows/runtime-postgres-rls.yml
          sha256sum .github/workflows/verify.yml
          sha256sum scripts/buyer-acceptance/live-postgres-rls.js
          sha256sum scripts/buyer-acceptance/apply-production-migrations-ci.sh
          sha256sum scripts/migrate.js
          sha256sum scripts/buyer-acceptance/ftth-audit-rls-semantic-audit.js
          sha256sum sql/migrations/124_ftth_audit_tenant_rls_semantics.sql
          sha256sum sql/bootstrap/02_extension_bootstrap.sql
          sha256sum sql/migrations/022_p0_authority_integrity.sql
          sha256sum sql/migrations/061_contractor_supply_chain.sql
          sha256sum sql/migrations/083_rls_gap_hash_ledger_org_units_fix.sql
          sha256sum sql/migrations/087_ticket_tenant_scope_guard.sql
          sha256sum scripts/buyer-acceptance/live-oidc-jwks.js

      - name: Install exact lockfile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Render release-provenance preview from the exact checked-out tree
        run: |
          set -euo pipefail
          node scripts/release-provenance.js
          mkdir -p release-provenance-preview
          cp SALES_PACKAGE_MANIFEST.json release-provenance-preview/
          cp apps/ops-web/public/buyer-data.json release-provenance-preview/
          cp docs/commercial/COMMERCIAL_RELEASE_STATUS.md release-provenance-preview/
          cp docs/commercial/COMMERCIAL_RELEASE_RECEIPT.md release-provenance-preview/
          cp FINAL_VERIFICATION_STATUS.md release-provenance-preview/
          cp docs/PACKAGE_CONTENTS_SHA256SUMS.txt release-provenance-preview/

      - name: Upload deterministic provenance preview (no repository write)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-provenance-preview-${{ github.sha }}
          path: release-provenance-preview/
          if-no-files-found: warn
          retention-days: 3

      - name: Apply checksum-verified migrations to real PostgreSQL/PostGIS (ephemeral CI runtime)
        run: |
          set -euo pipefail
          MIGRATOR_URL="$MIGRATOR_URL" bash scripts/buyer-acceptance/apply-production-migrations-ci.sh

      - name: Assert complete production migration history
        run: |
          set -euo pipefail
          expected_count="$(grep -Ec '^[0-9]{3}_.+\.sql$' sql/migrations/PRODUCTION_MIGRATIONS.txt)"
          expected_last="$(tail -n 1 sql/migrations/PRODUCTION_MIGRATIONS.txt)"
          count="$(psql "$ADMIN_URL" -Atqc "SELECT count(*) FROM public.fiberos_migration_history")"
          last="$(psql "$ADMIN_URL" -Atqc "SELECT migration_name FROM public.fiberos_migration_history ORDER BY migration_name DESC LIMIT 1")"
          test "$count" = "$expected_count"
          test "$last" = "$expected_last"
          echo "Verified migration history: count=$count last=$last"

      - name: Apply restricted post-migration role grants and revoke temporary policy-reader authority
        run: psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -f sql/bootstrap/20_runtime_role_grants.sql

      - name: Prove runtime migration attestation without raw ledger access
        run: |
          set -euo pipefail
          expected_count="$(grep -Ec '^[0-9]{3}_.+\.sql$' sql/migrations/PRODUCTION_MIGRATIONS.txt)"
          expected_last="$(tail -n 1 sql/migrations/PRODUCTION_MIGRATIONS.txt)"
          expected_digest="$(node -e 'const g = require("./scripts/production-readiness-gate"); console.log(g.migrationHistoryFingerprint(g.loadExpectedMigrationLedger().migrations))')"
          attestation="$(psql "$APP_URL" -v ON_ERROR_STOP=1 -AtF '|' -c "SELECT migration_count, latest_migration, ledger_sha256 FROM public.fiberos_migration_history_attestation()")"
          IFS='|' read -r actual_count actual_last actual_digest <<< "$attestation"
          test "$actual_count" = "$expected_count"
          test "$actual_last" = "$expected_last"
          test "$actual_digest" = "$expected_digest"
          [[ "$actual_digest" =~ ^[a-f0-9]{64}$ ]]
          echo "Runtime attestation matches ledger count=$actual_count head=$actual_last fingerprint=matched"
          denied_log="$(mktemp)"
          if psql "$APP_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM public.fiberos_migration_history" >/dev/null 2>"$denied_log"; then
            rm -f "$denied_log"
            echo "Runtime must not read raw migration ledger rows." >&2
            exit 1
          fi
          if ! grep -Fq "permission denied for table fiberos_migration_history" "$denied_log"; then
            cat "$denied_log" >&2
            rm -f "$denied_log"
            echo "Raw ledger SELECT failed for an unexpected reason." >&2
            exit 1
          fi
          rm -f "$denied_log"
          echo "Verified runtime can call the bounded attestation but cannot SELECT raw migration history."

      - name: Exercise migration 184 hardening window and restore least privilege
        run: |
          set -euo pipefail
          expected_log="$(mktemp)"
          if psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -f sql/migrations/184_harden_field_scope_and_contact_center_tenant_policies.sql >"$expected_log" 2>&1; then
            cat "$expected_log" >&2
            echo "MIGRATION_184_MUST_FAIL_WITHOUT_TEMPORARY_POLICY_READER_MEMBERSHIP" >&2
            exit 1
          fi
          grep -F "FIBEROS_POLICY_READER_MEMBERSHIP_REQUIRED" "$expected_log"
          rm -f "$expected_log"

          # Simulate the documented DBA-only upgrade window, then restore the
          # exact post-migration hardening contract after the migration succeeds.
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "GRANT fiberos_policy_reader TO fiberos_owner"
          expected_log="$(mktemp)"
          if psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -f sql/migrations/184_harden_field_scope_and_contact_center_tenant_policies.sql >"$expected_log" 2>&1; then
            cat "$expected_log" >&2
            echo "MIGRATION_184_MUST_REQUIRE_TEMPORARY_SCHEMA_CREATE" >&2
            exit 1
          fi
          grep -F "FIBEROS_POLICY_READER_PUBLIC_CREATE_REQUIRED" "$expected_log"
          rm -f "$expected_log"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "GRANT CREATE ON SCHEMA public TO fiberos_policy_reader"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -f sql/migrations/184_harden_field_scope_and_contact_center_tenant_policies.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -f sql/bootstrap/20_runtime_role_grants.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF pg_has_role('fiberos_owner', 'fiberos_policy_reader', 'MEMBER') THEN
              RAISE EXCEPTION 'MIGRATION_184_TEMPORARY_MEMBERSHIP_NOT_REVOKED';
            END IF;
            IF has_schema_privilege('fiberos_policy_reader', 'public', 'CREATE') THEN
              RAISE EXCEPTION 'POLICY_READER_PUBLIC_CREATE_PRIVILEGE_REMAINS';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public'
                AND p.proname = 'fiberos_field_technician_scope'
                AND p.proconfig @> ARRAY['row_security=off']
            ) THEN
              RAISE EXCEPTION 'TECHNICIAN_SCOPE_ROW_SECURITY_OVERRIDE_REMAINS';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public'
                AND tablename = 'contact_center_conversation_messages'
                AND policyname = 'cc_messages_customer'
                AND qual LIKE '%c.tenant_id = contact_center_conversation_messages.tenant_id%'
            ) THEN
              RAISE EXCEPTION 'CONTACT_CENTER_MESSAGE_TENANT_CORRELATION_MISSING';
            END IF;
          END
          $$;
          SQL

      - name: Assert migration-ledger ACL isolation
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_role text;
            v_privilege text;
          BEGIN
            FOREACH v_role IN ARRAY ARRAY['anon', 'authenticated', 'fiberos_app', 'fiberos_runtime', 'fiberos_worker'] LOOP
              FOREACH v_privilege IN ARRAY ARRAY['SELECT', 'INSERT', 'UPDATE', 'DELETE', 'TRUNCATE', 'REFERENCES', 'TRIGGER'] LOOP
                IF has_table_privilege(v_role, 'public.fiberos_migration_history', v_privilege) THEN
                  RAISE EXCEPTION 'FIBEROS_MIGRATION_HISTORY_APP_PRIVILEGE_LEAK:%:%', v_role, v_privilege;
                END IF;
              END LOOP;
            END LOOP;
            IF NOT has_table_privilege('fiberos_migrator', 'public.fiberos_migration_history', 'SELECT') THEN
              RAISE EXCEPTION 'FIBEROS_MIGRATION_HISTORY_MIGRATOR_READ_REQUIRED';
            END IF;
            FOREACH v_privilege IN ARRAY ARRAY['INSERT', 'UPDATE', 'DELETE', 'TRUNCATE', 'REFERENCES', 'TRIGGER'] LOOP
              IF has_table_privilege('fiberos_migrator', 'public.fiberos_migration_history', v_privilege) THEN
                RAISE EXCEPTION 'FIBEROS_MIGRATION_HISTORY_MIGRATOR_WRITE_FORBIDDEN:%', v_privilege;
              END IF;
            END LOOP;
          END
          $$;
          SQL

      - name: Execute live RLS attack and concurrency harness
        env:
          RUNTIME_ADMIN_DATABASE_URL: ${{ env.ADMIN_URL }}
          RUNTIME_APP_DATABASE_URL: ${{ env.APP_URL }}
        run: node scripts/buyer-acceptance/live-postgres-rls.js

      - name: Prove tenant semantics and append-only boundaries for FTTH audit tables
        env:
          RUNTIME_ADMIN_DATABASE_URL: ${{ env.ADMIN_URL }}
          RUNTIME_APP_DATABASE_URL: ${{ env.APP_URL }}
        run: node scripts/buyer-acceptance/ftth-audit-rls-semantic-audit.js

      - name: Execute adversarial runtime database-boundary audit
        run: node scripts/buyer-acceptance/adversarial-db-runtime-audit.js

      - name: Execute exhaustive live tenant-FK mutation audit
        run: node scripts/buyer-acceptance/adversarial-tenant-fk-mutation-audit.js

      - name: Record runtime evidence boundary
        run: |
          cat > runtime-evidence.txt <<'EOF'
          FiberOS runtime evidence class:
          EPHEMERAL_CI_RUNTIME

          This run proves behavior against the pinned PostgreSQL/PostGIS container used by this CI job.
          It is not buyer-production certification and does not verify an external customer's infrastructure,
          network segmentation, managed database service, identity provider, or physical instruments.
          EOF

      - name: Upload runtime evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FiberOS-runtime-postgres-rls-${{ github.sha }}
          path: runtime-evidence.txt
          if-no-files-found: error
          retention-days: 14
