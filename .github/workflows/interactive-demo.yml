name: interactive-demo

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/field-web/public/buyer-demo.html'
      - 'scripts/build-interactive-demo.js'
      - '.github/workflows/interactive-demo.yml'

permissions:
  contents: read

jobs:
  package-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build interactive buyer demo
        run: |
          set -euo pipefail
          node scripts/build-interactive-demo.js
          SHORT_SHA="${GITHUB_SHA::12}"
          ZIP="FiberOS-interactive-demo-${SHORT_SHA}.zip"
          rm -f "${ZIP}"
          zip -qr "${ZIP}" .release/interactive-demo
          test -s "${ZIP}"
          sha256sum "${ZIP}" | tee "${ZIP}.sha256"
      - name: Upload interactive buyer demo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FiberOS-interactive-demo-${{ github.sha }}
          path: |
            FiberOS-interactive-demo-*.zip
            FiberOS-interactive-demo-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
