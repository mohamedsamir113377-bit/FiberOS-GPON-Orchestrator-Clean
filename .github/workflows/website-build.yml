name: website-build
# Site perf budgets in CI.

on:
  push:
    branches: [main, 'website/**', 'fix/**', 'feat/website-ftth-asset-hierarchy-2026-10-09']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install runtime and browser dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build and verify static website
        run: npm run website:test
      - name: Install Lighthouse CLI
        run: npm install --global lighthouse@12.8.2
      - name: Serve static site for Lighthouse
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .netlify/site >/tmp/fiberos-lighthouse-server.log 2>&1 &
          for _ in $(seq 1 20); do
            curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
      - name: Run Lighthouse budgets on all key routes
        run: |
          mkdir -p lighthouse-artifacts
          export CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          for r in home:/ ops:/ops/ enterprise:/enterprise-command.html field:/field/; do
            n=${r%%:*}; p=${r#*:}
            lighthouse "http://127.0.0.1:4173$p" --budget-path=lighthouse-budget.json --only-categories=performance --output=json --output-path="lighthouse-artifacts/$n.json" --chrome-flags='--headless --no-sandbox --disable-gpu'
          done
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-performance-report
          path: lighthouse-artifacts
          if-no-files-found: warn
          retention-days: 14
