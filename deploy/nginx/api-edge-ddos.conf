# FiberOS API edge — connection and request flood controls (nginx)
# Place in front of services/api (and optionally ai/gis).
# This absorbs HTTP-layer floods at the reverse proxy. It does NOT replace
# provider volumetric (L3/L4) mitigation (Cloudflare / AWS Shield / Azure DDoS).
#
# Usage (example):
#   include /etc/nginx/fiberos/api-edge-ddos.conf;
# Upstream must bind API to loopback only (see docker-compose.sales.yml ports).

# Shared memory zones for rate / concurrency (tune to host capacity)
limit_req_zone  $binary_remote_addr zone=fiberos_req_per_ip:20m  rate=30r/s;
limit_req_zone  $binary_remote_addr zone=fiberos_req_auth:20m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=fiberos_conn_per_ip:10m;

# Optional: when origin is only reachable via Cloudflare (or similar),
# set real_ip from CF-Connecting-IP and allowlist edge CIDRs at the host firewall.
# map $http_cf_connecting_ip $fiberos_client_ip {
#   default $remote_addr;
#   ~.      $http_cf_connecting_ip;
# }

upstream fiberos_api {
  server 127.0.0.1:8080;
  keepalive 32;
}

server {
  listen 443 ssl http2;
  server_name api.example.invalid;

  # Operator-supplied certificates — never commit private keys
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Shrink slowloris / header flood surface
  client_header_timeout 10s;
  client_body_timeout   20s;
  keepalive_timeout     15s;
  send_timeout          20s;
  client_max_body_size  8m;
  large_client_header_buffers 4 16k;
  server_tokens off;

  # Global per-IP concurrency (open connections)
  limit_conn fiberos_conn_per_ip 32;

  location /health {
    limit_req zone=fiberos_req_per_ip burst=20 nodelay;
    proxy_pass http://fiberos_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    limit_req zone=fiberos_req_per_ip burst=60 nodelay;
    limit_req zone=fiberos_req_auth burst=20 nodelay;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_pass http://fiberos_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
  }
}
