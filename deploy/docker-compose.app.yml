# FiberOS R14.1 — Layer 2: application. Starts only after the DB healthcheck passes.
# The API uses the constrained runtime role; the migrator credential is NOT mounted here.
name: fiberos

services:
  api:
    image: fiberos/runtime:r14.1
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
      args: { SERVICE: api }
    depends_on:
      db:
        condition: service_healthy          # do not start on "process alive"
    environment:
      NODE_ENV: production
      API_PORT: "8080"
      API_BIND_HOST: 0.0.0.0
      DATABASE_URL_FILE: /run/secrets/runtime_database_url
      JWT_VERIFY: "true"
      PG_SSL: "true"
      PG_SSL_REJECT_UNAUTHORIZED: "true"
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:?set the production IdP JWKS URL}
      OIDC_ISSUER: ${OIDC_ISSUER:?set the production IdP issuer}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?set the production API audience}
      OIDC_JWKS_ALLOWED_HOSTS: ${OIDC_JWKS_ALLOWED_HOSTS:?set the allowlisted IdP host}
      CORS_ORIGIN: ${CORS_ORIGIN:?set the allowed browser origin}
      SECURITY_HEADERS_ENABLED: "true"
      SECURITY_RATE_LIMIT_PER_MINUTE: ${SECURITY_RATE_LIMIT_PER_MINUTE:-120}
      SECURITY_RATE_LIMIT_BURST: ${SECURITY_RATE_LIMIT_BURST:-30}
      SECURITY_RATE_LIMIT_BACKEND: ${SECURITY_RATE_LIMIT_BACKEND:-PROCESS_LOCAL}
      SECURITY_RATE_LIMIT_EXPECTED_INSTANCES: ${SECURITY_RATE_LIMIT_EXPECTED_INSTANCES:-1}
      REDIS_URL: "${REDIS_URL:-}"
      # Never default this boundary silently: OIDC/browser clients may explicitly opt out,
      # while HMAC-signing kernel clients may set true. The replay store is process-local.
      FIBEROS_KERNEL_BOUNDARY_REQUIRED: ${FIBEROS_KERNEL_BOUNDARY_REQUIRED:?set explicitly to true or false}
    secrets:
      - runtime_database_url
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    image: fiberos/runtime:r14.1
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
      args: { SERVICE: worker }
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_WORKER_URL_FILE: /run/secrets/worker_database_url   # separate credential
      PG_SSL: "true"
      PG_SSL_REJECT_UNAUTHORIZED: "true"
    secrets:
      - worker_database_url
    restart: unless-stopped

secrets:
  runtime_database_url:
    file: ../secrets/runtime_database_url.txt
  worker_database_url:
    file: ../secrets/worker_database_url.txt
