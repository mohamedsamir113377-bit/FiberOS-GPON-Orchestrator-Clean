[build]
  command = "node scripts/build-netlify-site.js"
  publish = ".netlify/site"

[build.environment]
  NODE_VERSION = "24.21.0"

[dev]
  command = "python3 -m http.server 4173 --directory .netlify/site"
  port = 4173

# Defense-in-depth: same posture as publish-dir _headers (build emits the authoritative file).
# FIBEROS_API_BASE is a public URL only; never place tokens/secrets in it.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"
    X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/ops/index.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/field/index.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/enterprise-command.html"
  [headers.values]
    Cache-Control = "no-store"
